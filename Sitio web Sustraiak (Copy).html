 Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Multi-Agent Workflows and Loops<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1080px 1fr;gap:90px;margin-top:auto;margin-bottom:auto;align-items:center\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:1fr 48px 1fr 48px 1fr 48px 1fr;align-items:stretch\">\n          <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 24px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Plan<\u002Fdiv>\n            <p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Splits the goal into tasks<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:32px;color:#BE7539\">→<\u002Fdiv>\n          <div style=\"background:#241B12;padding:28px 24px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#F6F1E9\">Build<\u002Fdiv>\n            <p style=\"font-size:24px;line-height:1.4;color:#C9BBA6;margin-top:10px\">Writes the code<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:32px;color:#BE7539\">→<\u002Fdiv>\n          <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 24px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Review<\u002Fdiv>\n            <p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Checks quality and security<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:32px;color:#BE7539\">→<\u002Fdiv>\n          <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 24px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Test<\u002Fdiv>\n            <p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Runs and verifies the result<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 48px 1fr 48px 1fr 48px 1fr\">\n          <div><\u002Fdiv><div><\u002Fdiv>\n          <div style=\"grid-column:3 / 8;height:70px;margin:0 calc((100% - 144px) / 8);border:3px dashed #BE7539;border-top:none;border-radius:0 0 18px 18px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;color:#A4622E;margin-top:18px;padding-left:270px\">Loop until it passes<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:30px\">\n        <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#A4622E\">01<\u002Fspan><p style=\"font-size:32px;line-height:1.4\">Run agents in parallel on separate tasks.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#A4622E\">02<\u002Fspan><p style=\"font-size:32px;line-height:1.4\">Let one agent review another's work.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#A4622E\">03<\u002Fspan><p style=\"font-size:32px;line-height:1.4\">Close the loop: build, test, fix, repeat.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 WORKFLOW TO MINDSET -->\n  <section data-label=\"From Workflow to Mindset\" data-speaker-notes=\"Write down how you build. Repeat it until it is a process. Keep repeating until you no longer think about it. That is the mindset.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">From Workflow to Mindset<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 80px 1fr 80px 1fr;margin-top:auto;margin-bottom:auto;align-items:start\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#A4622E\">01<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:80px;font-weight:600;letter-spacing:-.03em;margin-top:14px\">Workflow<\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:22px\">Write down how you build, step by step.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;color:#BE7539;padding-top:58px;text-align:center\">→<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#A4622E\">02<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:80px;font-weight:600;letter-spacing:-.03em;margin-top:14px\">Process<\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:22px\">Repeat it on every project and improve it each time.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;color:#BE7539;padding-top:58px;text-align:center\">→<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#A4622E\">03<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:80px;font-weight:600;letter-spacing:-.03em;margin-top:14px;color:#A4622E\">Mindset<\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:22px\">It becomes how you think, without effort.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 15 ITERATION -->\n  <section data-label=\"Iteration After Iteration\" data-speaker-notes=\"Agility. Have something working on day one, then make it better every day. Show it early, even when it is not perfect.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Iteration After Iteration<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:620px 1fr;gap:100px;margin-top:auto;margin-bottom:auto;align-items:center\">\n      <div>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:500;line-height:1.18;letter-spacing:-.02em\">Ship a working version early, then improve it every day.<\u002Fp>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:30px\">Show it before it is perfect. Every round of feedback makes the next one faster.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:30px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">v1<\u002Fspan><span style=\"font-size:28px;color:#5C5043\">The core flow works end to end<\u002Fspan><\u002Fdiv>\n          <div style=\"height:22px;background:#E7D6BF;margin-top:12px\"><div style=\"width:25%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">v2<\u002Fspan><span style=\"font-size:28px;color:#5C5043\">Feedback applied, edge cases covered<\u002Fspan><\u002Fdiv>\n          <div style=\"height:22px;background:#E7D6BF;margin-top:12px\"><div style=\"width:50%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">v3<\u002Fspan><span style=\"font-size:28px;color:#5C5043\">Design polished, performance tuned<\u002Fspan><\u002Fdiv>\n          <div style=\"height:22px;background:#E7D6BF;margin-top:12px\"><div style=\"width:75%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">v4<\u002Fspan><span style=\"font-size:28px;color:#5C5043\">Secure, scalable and ready for real users<\u002Fspan><\u002Fdiv>\n          <div style=\"height:22px;background:#E7D6BF;margin-top:12px\"><div style=\"width:100%;height:100%;background:#A4622E\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 SKILLS -->\n  <section data-label=\"Building Your Own Skills\" data-speaker-notes=\"Skills are how the work compounds. The second time you solve something, package it so you and your agents never solve it from zero again.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Building Your Own Skills<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:100px;margin-top:auto;margin-bottom:auto\">\n      <div>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:500;line-height:1.22;letter-spacing:-.02em\">A skill is a reusable set of instructions, templates and rules that an agent can follow.<\u002Fp>\n        <div style=\"margin-top:44px;background:#241B12;padding:30px 34px\">\n          <p style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#BE7539\">Solved something twice?<\u002Fp>\n          <p style=\"font-size:30px;color:#F6F1E9;margin-top:8px\">Turn it into a skill.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:16px;border-bottom:2px solid #241B12\">Skills worth building<\u002Fdiv>\n        <div style=\"font-size:31px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Project setup with auth, database and deploy<\u002Fdiv>\n        <div style=\"font-size:31px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Brand and UI system from a reference<\u002Fdiv>\n        <div style=\"font-size:31px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Security review checklist<\u002Fdiv>\n        <div style=\"font-size:31px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\">SEO and performance pass<\u002Fdiv>\n        <div style=\"font-size:31px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Payments and notifications module<\u002Fdiv>\n        <div style=\"font-size:31px;padding:20px 0\">Release notes and handover<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- MAKE IT YOURS -->\n  <section data-label=\"Make the Process Yours\" data-speaker-notes=\"Everything in this deck is one process, mine. Take it, adapt it and improve it until it is yours. Package what you repeat into skills, commands and plugins, and keep refining after every project.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Make the Process Yours<\u002Fh2>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:500;line-height:1.18;letter-spacing:-.02em;margin-top:50px;max-width:1500px\">This deck is a starting point. Within a month, your own process should be better than this one.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 50px 1fr 50px 1fr 50px 1fr;margin-top:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:30px 30px 34px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">01<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;margin-top:10px;color:#241B12\">Take it<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;margin-top:12px;color:#5C5043\">Start from this process, exactly as it is.<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:30px 30px 34px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">02<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;margin-top:10px;color:#241B12\">Adapt it<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;margin-top:12px;color:#5C5043\">Change what does not fit how you work.<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:30px 30px 34px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">03<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;margin-top:10px;color:#241B12\">Package it<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;margin-top:12px;color:#5C5043\">Turn repeated steps into skills, commands and plugins.<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#241B12;border-top:4px solid #BE7539;padding:30px 30px 34px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">04<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;margin-top:10px;color:#F6F1E9\">Improve it<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;margin-top:12px;color:#C9BBA6\">Refine it after every single project.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#A4622E;margin-top:40px\">Your framework compounds: every project makes the next one faster.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- TOOLING -->\n  <section data-label=\"Tooling\" data-speaker-notes=\"Today Claude Code is the best tool for this way of working. Cursor, Devin or other IDEs are fine if you really prefer them. What matters most is being efficient: the right tool, on every device, with commands for anything you repeat.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Tooling<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:780px 1fr;gap:80px;margin-top:50px\">\n      <div style=\"background:#241B12;padding:44px 48px 48px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Our main tool today<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:84px;font-weight:600;letter-spacing:-.03em;line-height:1;color:#F6F1E9;margin-top:22px\">Claude Code<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#C9BBA6;margin-top:24px\">Agentic coding in the terminal, the IDE, the browser and on your phone.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Also good, if you prefer them<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Cursor<\u002Fspan><span style=\"font-size:26px;color:#5C5043;text-align:right\">AI-first code editor<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Devin<\u002Fspan><span style=\"font-size:26px;color:#5C5043;text-align:right\">Autonomous engineering agent<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Other IDEs<\u002Fspan><span style=\"font-size:26px;color:#5C5043;text-align:right\">With the AI tools you like<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:auto\">\n      <div style=\"border-top:3px solid #BE7539;padding-top:22px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">On your phone<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:10px\">Install it, send a task from anywhere, review it later.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:3px solid #BE7539;padding-top:22px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Commands for repeated work<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:10px\">One command instead of the same ten prompts.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:3px solid #BE7539;padding-top:22px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">The right tool for each task<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:10px\">Minutes saved every hour add up to days.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WAITING TIME -->\n  <section data-label=\"Working While the Agents Think\" data-speaker-notes=\"Never sit and watch a model think. While one agent works, research, review, plan or test. Use frameworks and skills that split work into sub-agents, and build your own skills from what you learn.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Working While the Agents Think<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:90px;margin-top:50px\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">While an agent works, you<\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:30px;line-height:1.4\">Research the next feature or the next problem.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:30px;line-height:1.4\">Review what another agent just finished.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:30px;line-height:1.4\">Write the plan and prompt for the next task.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:30px;line-height:1.4\">Test the latest build on your phone.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Tools that multiply your time<\u002Fdiv>\n        <div style=\"padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Superpowers<\u002Fdiv><p style=\"font-size:25px;line-height:1.4;color:#5C5043;margin-top:4px\">Skills for brainstorming, planning, TDD and sub-agent development<\u002Fp><\u002Fdiv>\n        <div style=\"padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Graphify<\u002Fdiv><p style=\"font-size:25px;line-height:1.4;color:#5C5043;margin-top:4px\">Turns the codebase into a knowledge graph agents can query<\u002Fp><\u002Fdiv>\n        <div style=\"padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Sub-agent frameworks<\u002Fdiv><p style=\"font-size:25px;line-height:1.4;color:#5C5043;margin-top:4px\">One agent plans while others build and test in parallel<\u002Fp><\u002Fdiv>\n        <div style=\"padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Your own skills<\u002Fdiv><p style=\"font-size:25px;line-height:1.4;color:#5C5043;margin-top:4px\">Research how the best people work, then build yours<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;color:#A4622E;margin-top:auto\">Never wait for a model to finish. Waiting time is working time.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- WORKTREES -->\n  <section data-label=\"Parallel Agents with Worktrees\" data-speaker-notes=\"Git worktrees give each agent its own copy of the repository, so three features progress at the same time. Your job changes from writing code to reviewing, deciding and merging.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Parallel Agents with Worktrees<\u002Fh2>\n    <div style=\"display:flex;justify-content:center;margin-top:50px\">\n      <div style=\"background:#241B12;padding:26px 60px;text-align:center\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#F6F1E9\">You<\u002Fdiv>\n        <div style=\"font-size:26px;color:#C9BBA6;margin-top:4px\">Review, decide and merge<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:center\"><div style=\"width:3px;height:44px;background:#BE7539\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"position:relative;height:40px;margin:0 calc((100% - 72px) / 6);border:3px solid #BE7539;border-bottom:none\">\n      <div style=\"position:absolute;left:50%;top:0;width:3px;height:37px;margin-left:-1.5px;background:#BE7539\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:36px\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:28px 30px 32px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#A4622E\">../app-booking<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:14px\">Agent 1<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:8px\">Builds the booking flow<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:28px 30px 32px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#A4622E\">../app-admin<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:14px\">Agent 2<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:8px\">Builds the admin panel<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:28px 30px 32px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#A4622E\">../app-tests<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:14px\">Agent 3<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:8px\">Writes and runs the tests<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:40px;background:#241B12;padding:26px 36px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:27px;color:#EDE3D3\">git worktree add ../app-admin -b feature-admin<\u002Fspan>\n      <span style=\"font-size:26px;color:#C9BBA6\">One copy of the repo per agent<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHAT IT MEANS FOR YOU -->\n  <section data-label=\"What This Means for You\" data-speaker-notes=\"Make this personal. This is not about the company, it is about each of them: income, free time, interesting work and the satisfaction of solving real problems.\" style=\"background:#241B12;color:#F6F1E9;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#F6F1E9\">What This Means for You<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:56px 64px;margin-top:auto\">\n      <div style=\"border-top:1px solid rgba(231,214,191,.25);padding-top:26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">01<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:12px;color:#F6F1E9\">You join the top 1% of developers.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(231,214,191,.25);padding-top:26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">02<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:12px;color:#F6F1E9\">You are paid for the value you create.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(231,214,191,.25);padding-top:26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">03<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:12px;color:#F6F1E9\">You win back time for your own life.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(231,214,191,.25);padding-top:26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">04<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:12px;color:#F6F1E9\">You work on exciting projects.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(231,214,191,.25);padding-top:26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">05<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:12px;color:#F6F1E9\">You solve real problems for real people.<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(231,214,191,.25);padding-top:26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">06<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:12px;color:#BE7539\">You have the best job in the world.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 99% -->\n  <section data-label=\"Standing Apart from the 99%\" data-speaker-notes=\"Link this to the previous slide: the top 1% is not about IQ, it is about execution. Focus, over-delivery and effort aimed at a clear goal, sustained over years.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">04 · Further efficiency<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Standing Apart from the 99%<\u002Fh2>\n    <p style=\"font-size:28px;color:#5C5043;margin-top:18px\">Ideas shared by Alexandr Wang, founder of Scale AI<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:32px 34px 36px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">01<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;margin-top:10px\">Absolute focus<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Put all your energy into the one thing that matters. Most busyness is low-value effort.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:32px 34px 36px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">02<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;margin-top:10px\">Over-deliver<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">If the standard is one mile, go ten. Routinely delivering double earns the reputation and the premium.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:32px 34px 36px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">03<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;margin-top:10px\">Targeted output<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Effort aimed at a specific goal and sustained over time. Treat every delivery as if it matters most.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#241B12;padding:32px 40px 36px;margin-top:32px;display:flex;justify-content:space-between;align-items:flex-end;gap:50px\">\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:500;line-height:1.25;color:#F6F1E9;max-width:1100px\">Smart people are everywhere. People who deliver more than expected, year after year, are rare.<\u002Fp>\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#BE7539;white-space:nowrap\">Execution is the moat.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 17 SECTION 04 -->\n  <section data-label=\"05 Two Hackathons\" data-speaker-notes=\"Part four: now we put all of this into practice.\" style=\"background:#241B12;color:#F6F1E9;padding:110px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"position:absolute;right:-220px;bottom:-300px;width:900px;height:900px\">\n      <svg sc-camel-view-box=\"0 0 120 120\" width=\"900\" height=\"900\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"sx17\"><ci
