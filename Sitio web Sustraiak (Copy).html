grid-template-columns:200px 1fr;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Every day<\u002Fspan><span style=\"font-size:29px\"><b style=\"font-family:'Space Grotesk',sans-serif;font-size:34px\">Dozens<\u002Fb> of new ads and posts<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 1fr;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Every week<\u002Fspan><span style=\"font-size:29px\"><b style=\"font-family:'Space Grotesk',sans-serif;font-size:34px\">Hundreds<\u002Fb> of variants tested<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:200px 1fr;align-items:baseline;padding:18px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Every month<\u002Fspan><span style=\"font-size:29px\"><b style=\"font-family:'Space Grotesk',sans-serif;font-size:34px\">Thousands<\u002Fb> of results the harness learns from<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:36px 40px\"><p style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;line-height:1.2;color:#F6F1E9\">Adapt, never copy blindly.<\u002Fp><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Use the idea and structure, never another brand's assets.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M10 NO API -->\n  <section data-label=\"M · No API? Use the Browser\" data-speaker-notes=\"Many platforms have no API, or a limited one. Agents can control a real browser with Playwright and do what a person would do. Always respect each platform's terms of use.\" style=\"background:#241B12;color:#F6F1E9;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Marketing · No API<\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.035em;line-height:1.04;color:#F6F1E9;margin-top:auto;max-width:1600px\">No API? The agent uses the browser like a person.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:80px;padding-top:36px;border-top:1px solid rgba(231,214,191,.25)\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#BE7539\">Playwright<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Scripts that click, type and upload on any website.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#BE7539\">Browser agents<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Claude in Chrome or computer use, for tasks that change every time.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;color:#BE7539\">Typical uses<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Publishing on directories, downloading reports, updating old CMS sites.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M11 FULL PROCESS -->\n  <section data-label=\"M · One Campaign, Fully Automated\" data-speaker-notes=\"Walk through one full cycle. People set the objective and approve; agents do the rest. This is exactly what we will run for the Sustraiak pilot.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · End to end<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">One Campaign, Fully Automated<\u002Fh2>\n    <div style=\"margin-top:44px;border-top:2px solid #241B12\">\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Day 1<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Research the audience, competitors and their ads<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">Claude Code, web search, ad libraries<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Day 1<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Write the offer and 20 ad variants<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">Claude with the brand skill<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Day 2<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Produce images, videos and a landing page<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">Higgsfield, Nano Banana, ElevenLabs, Vercel<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Day 2<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Human review and approval<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">You: brand, claims and budget<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Day 3<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Launch on Google, Meta and LinkedIn<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">Ads APIs and MCPs<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Daily<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Read results, pause losers, scale winners<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">The harness, within budget rules<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr 560px;gap:40px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#A4622E\">Weekly<\u002Fspan><span style=\"font-size:30px;font-weight:600;line-height:1.35\">Report and new variants from what was learned<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#5C5043\">Claude Code, sent by email<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M12 PILOT -->\n  <section data-label=\"M · The Sustraiak Pilot\" data-speaker-notes=\"Concrete proposal: VKAPS runs Sustraiak's marketing for the first weeks with this method. Agree the objective and channels during the week, and start right after.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · Pilot<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Sustraiak Pilot<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:36px;margin-top:auto;margin-bottom:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#A4622E\">Objective<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Qualified companies requesting a free prototype.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#A4622E\">Channels<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">LinkedIn, Google Ads, email and the website.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#A4622E\">Measure<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Cost per lead and calls booked each week.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#241B12;padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#F6F1E9\">Outcome<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:14px\">A working harness and VKAPS’s first case study.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#A4622E\">We define it together this week and start right after.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- M13 CLOSING -->\n  <section data-label=\"M · Closing\" data-speaker-notes=\"Close the marketing session. The product is half the work; getting it to people is the other half, and now it can be automated too.\" style=\"background:#241B12;color:#F6F1E9;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"position:absolute;right:-230px;bottom:-280px;width:980px;height:980px\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"980\" height=\"980\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"mk13\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#mk13)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;gap:18px\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"56\" height=\"56\"
