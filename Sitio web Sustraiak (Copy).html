1px solid rgba(231,214,191,.25)\">\n          <div style=\"display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid rgba(231,214,191,.25);font-size:28px\"><span style=\"color:#C9BBA6\">Format<\u002Fspan><span style=\"font-weight:600;color:#F6F1E9\">Live app and code<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:20px;padding:20px 0;font-size:28px\"><span style=\"color:#C9BBA6\">Result<\u002Fspan><span style=\"font-weight:600;color:#F6F1E9\">Evaluated against this deck<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 18B H1 TWO PROJECTS -->\n  <section data-label=\"Hackathon 1 · Two Projects\" data-speaker-notes=\"Hackathon 1 has two real clients. Each person chooses one and builds their own complete version. Same rules, same jury, same demo day. Try to have both projects covered by the team.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Choose one<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Two Projects, Two Real Clients<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:52px;flex:1;min-height:0\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:50px 54px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Project A<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Reservas Iturrieta<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.4;color:#5C5043;margin-top:14px\">Sidrería Iturrieta · Aramaio, Basque Country<\u002Fp>\n        <p style=\"font-size:34px;line-height:1.4;font-weight:600;color:#241B12;margin-top:auto\">A complete table booking system for a cider house.<\u002Fp>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;color:#A4622E;margin-top:26px;padding-top:22px;border-top:1px solid rgba(36,27,18,.15)\">iturrieta.eus<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:50px 54px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">Project B<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#F6F1E9\">A Una Milla<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.4;color:#C9BBA6;margin-top:14px\">A Una Milla de Tu Destino · Travel hacking<\u002Fp>\n        <p style=\"font-size:34px;line-height:1.4;font-weight:600;color:#F6F1E9;margin-top:auto\">An app that shows how much you save by travel hacking a trip, and lets you book it.<\u002Fp>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;color:#BE7539;margin-top:26px;padding-top:22px;border-top:1px solid rgba(231,214,191,.25)\">@aunamilladetudestino<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;color:#A4622E;margin-top:40px\">Choose one. Same rules, same jury, same demo day.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 19 H1 TITLE -->\n  <section data-label=\"Hackathon 1 · Project A · Reservas Iturrieta\" data-speaker-notes=\"Sidrería Iturrieta, a traditional cider house in Aramaio, in the Basque Country. A real business with a real booking problem.\" style=\"background:#241B12;color:#F6F1E9;padding:0;box-sizing:border-box;display:flex;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"width:820px;flex-shrink:0;padding:100px 90px 90px 110px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Hackathon 1 · Project A<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:auto\">Reservas Iturrieta<\u002Fh2>\n      <div style=\"width:80px;height:4px;background:#BE7539;margin-top:40px\"><\u002Fdiv>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6;margin-top:36px\">Sidrería Iturrieta<\u002Fp>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6\">Aramaio, Basque Country<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;background:#2E2318;padding:100px 110px 90px 90px;display:flex;flex-direction:column;justify-content:flex-end\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Their motto<\u002Fdiv>\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:24px\">Sagarretik txotxera<\u002Fp>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6;margin-top:24px\">From the apple to the txotx<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Project A · About Sidrería Iturrieta\" data-speaker-notes=\"All of this is on their website. Today they only take bookings by phone and WhatsApp and confirm them by hand. That is the problem the booking system solves.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project A · Reservas Iturrieta<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">About Sidrería Iturrieta<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 660px;gap:80px;margin-top:44px;flex:1;min-height:0\">\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:30px\">\n          <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;letter-spacing:.02em;line-height:1\">Iturrieta<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A4622E;margin-top:10px\">Sagardotegia · Aramaio<\u002Fdiv><\u002Fdiv>\n          <a href=\"https://www.iturrieta.eus/\" style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#A4622E\">iturrieta.eus<\u002Fa>\n        <\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;margin-top:30px\">A family farm and cider house in the Aramaio valley, 30 minutes from Vitoria. They grow their own organic apples and make their own natural cider.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;border-top:2px solid #241B12\">\n          <div style=\"padding:20px 24px 20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Since<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.2\">1998<\u002Fdiv><\u002Fdiv><div style=\"padding:20px 24px 20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Txotx season<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.2\">January to May<\u002Fdiv><\u002Fdiv><div style=\"padding:20px 24px 20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Open<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.2\">Thu to Sun, 13:00–16:00<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:20px 24px 20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Menu<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.2\">€45, children €16<\u002Fdiv><\u002Fdiv><div style=\"padding:20px 24px 20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Also<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.2\">Concerts, visits, shop<\u002Fdiv><\u002Fdiv><div style=\"padding:20px 24px 20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Website<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;margin-top:8px;line-height:1.2\">5 languages<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"height:380px;background:#E7D6BF;padding:44px 44px 40px;display:flex;flex-direction:column;justify-content:flex-end\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:132px;font-weight:700;letter-spacing:-.04em;line-height:1;color:#A4622E\">1,400<\u002Fdiv><p style=\"font-size:30px;line-height:1.4;color:#241B12;margin-top:16px\">Organic apple trees in the Aramaio valley<\u002Fp><\u002Fdiv>\n        <div style=\"background:#241B12;padding:30px 34px 34px;flex:1\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">Bookings today<\u002Fdiv>\n          <p style=\"font-size:29px;line-height:1.4;color:#F6F1E9;margin-top:10px\">By phone and WhatsApp only, confirmed by hand.<\u002Fp>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539;margin-top:24px\">What we will build<\u002Fdiv>\n          <p style=\"font-size:29px;line-height:1.4;color:#F6F1E9;margin-top:10px\">One booking system for web, WhatsApp and phone.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 20 H1 BRIEF -->\n  <section data-label=\"Project A · The Brief\" data-speaker-notes=\"Keep the brief short on purpose. Part of the challenge is finding out what a cider house needs. Use AI to research it.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project A · Reservas Iturrieta<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Brief<\u002Fh2>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;font-weight:500;line-height:1.16;letter-spacing:-.025em;margin-top:56px;max-width:1500px\">Build the complete table booking system for Sidrería Iturrieta.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:22px;margin-top:52px\">\n      <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-10px)\"><\u002Fspan><p style=\"font-size:36px;line-height:1.35\">Customers book online, by WhatsApp and by phone.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-10px)\"><\u002Fspan><p style=\"font-size:36px;line-height:1.35\">Staff run the floor in real time.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-10px)\"><\u002Fspan><p style=\"font-size:36px;line-height:1.35\">The owners control everything, from anywhere.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding-top:30px;border-top:2px solid #241B12\">\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#A4622E\">No more detail is given. Find your way.<\u002Fp>\n      <p style=\"font-size:28px;color:#5C5043;max-width:560px;text-align:right\">Start by learning how a Basque cider house works.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 21 FEATURE IDEAS -->\n  <section data-label=\"Project A · Feature Ideas\" data-speaker-notes=\"Pass over this one quickly. It is a starting point, not the specification. The best projects will find cases that are not on this list.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project A · Reservas Iturrieta<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;margin-top:22px\">\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05\">Feature Ideas<\u002Fh2>\n      <span style=\"font-size:30px;color:#5C5043\">A starting point, not the full list<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:56px;margin-top:52px\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Floor and schedule<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Arrange and move tables on a floor plan<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Define service shifts<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Close specific days<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Set the last booking time<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0\">Rules by group size<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Bookings<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Web, WhatsApp and phone, with a Retell voice agent<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Deposit payment when booking<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Automatic reminders<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Cancellations and changes of date<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0\">Blacklist for repeated no-shows<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Events and control<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Create events and send them by email and WhatsApp<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Publish events and news on the website<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Real-time screen for waiters<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Admin control from anywhere, with roles<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0\">Fully responsive<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;color:#A4622E;margin-top:auto\">What else? Think of many more cases.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 21B PROJECT B TITLE -->\n  <section data-label=\"Hackathon 1 · Project B · A Una Milla\" data-speaker-notes=\"A Una Milla de Tu Destino is a travel hacking community on Instagram. Their followers want to travel more for less. Today, working out the savings on a trip takes knowledge and hours of searching. That is what this app solves.\" style=\"background:#241B12;color:#F6F1E9;padding:0;box-sizing:border-box;display:flex;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"width:820px;flex-shrink:0;padding:100px 90px 90px 110px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Hackathon 1 · Project B<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:auto\">A Una Milla<\u002Fh2>\n      <div style=\"width:80px;height:4px;background:#BE7539;margin-top:40px\"><\u002Fdiv>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6;margin-top:36px\">A Una Milla de Tu Destino<\u002Fp>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6\">@aunamilladetudestino · Instagram<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;background:#2E2318;padding:100px 110px 90px 90px;display:flex;flex-direction:column;justify-content:flex-end\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">The idea<\u002Fdiv>\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:84px;font-weight:600;letter-spacing:-.03em;line-height:1.04;color:#F6F1E9;margin-top:24px\">Same trip. Much less money.<\u002Fp>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6;margin-top:24px\">Travel hacking, made simple for anyone<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Project B · The Problem\" data-speaker-notes=\"Explain travel hacking in one sentence: using miles, points, flexible dates, nearby airports and smart routes to pay much less for the same trip. Most people never do it because it is complicated. The app removes the complexity.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project B · A Una Milla<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Problem<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 660px;gap:80px;margin-top:50px;flex:1;min-height:0\">\n      <div style=\"display:flex;flex-direction:column\">\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:500;line-height:1.18;letter-spacing:-.02em\">Most people pay full price because travel hacking feels complicated.<\u002Fp>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:30px\">Miles, points, flexible dates, nearby airports, smarter routes. The savings are real, but finding them takes knowledge and hours of searching.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"background:#E7D6BF;padding:44px 44px 40px;flex:1;display:flex;flex-direction:column;justify-content:flex-end\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">The question every user has<\u002Fdiv><p style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;font-weight:600;line-height:1.15;margin-top:16px\">How much could I save on this trip?<\u002Fp><\u002Fdiv>\n        <div style=\"background:#241B12;padding:30px 34px 34px\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">What we will build<\u002Fdiv>\n          <p style=\"font-size:29px;line-height:1.4;color:#F6F1E9;margin-top:10px\">An app that answers it in seconds, then lets you book.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Project B · The Brief\" data-speaker-notes=\"Keep it short on purpose. The key is the savings: for any plan, the user must clearly see what they would pay normally and what they could pay with travel hacking. Two entry points: a full trip plan or a quick short flight. They decide how.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project B · A Una Milla<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Brief<\u002Fh2>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:500;line-height:1.16;letter-spacing:-.025em;margin-top:50px;max-width:1600px\">Build an app where anyone checks a trip, sees how much they can save by travel hacking it, and books the flight.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:22px;margin-top:46px\">\n      <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-10px)\"><\u002Fspan><p style=\"font-size:34px;line-height:1.35\">The user enters a trip: a full plan or a quick short flight.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-10px)\"><\u002Fspan><p style=\"font-size:34px;line-height:1.35\">The app shows the normal price, the hacked price and the savings.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-10px)\"><\u002Fspan><p style=\"font-size:34px;line-height:1.35\">The user books the flight, or gets clear steps to book it.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding-top:30px;border-top:2px solid #241B12\">\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#A4622E\">The savings are the product. Make them impossible to miss.<\u002Fp>\n      <p style=\"font-size:28px;color:#5C5043;max-width:560px;text-align:right\">Start by learning how travel hacking works.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Project B · Two Ways In\" data-speaker-notes=\"Two options with different needs. The quick flight is for someone who knows the route and wants an answer now. The full plan is for someone organising a trip with several stops, where the biggest savings usually are. How each one works is up to them.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project B · A Una Milla<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Two Ways In<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:52px;flex:1;min-height:0\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:50px 54px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Option 1<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:600;letter-spacing:-.025em;margin-top:22px\">Quick Flight<\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;color:#3E3529;margin-top:20px\">One route, one answer. For someone who knows where they want to go.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#A4622E;margin-top:auto\">Fast and simple<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:50px 54px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">Option 2<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:600;letter-spacing:-.025em;margin-top:22px;color:#F6F1E9\">Full Trip Plan<\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;color:#C9BBA6;margin-top:20px\">Several stops, dates and travellers. Where the biggest savings usually are.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#BE7539;margin-top:auto\">Complete and detailed<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Project B · Feature Ideas\" data-speaker-notes=\"Pass over this one quickly. It is a starting point, not the specification. Useful APIs to research: Duffel and Amadeus for flights and booking, Kiwi Tequila for combined routes, Seats.aero for award availability. The best projects will find cases that are not on this list.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Project B · A Una Milla<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;margin-top:22px\">\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05\">Feature Ideas<\u002Fh2>\n      <span style=\"font-size:30px;color:#5C5043\">A starting point, not the full list<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:56px;margin-top:52px\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Search<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Quick flight or full trip plan<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Flexible dates and nearby airports<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Several stops and travellers<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Paste a booking link or screenshot<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;\">Miles and points the user already has<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Savings<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Normal price against hacked price<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Savings in euros and percentage<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Miles, points and transfer partners<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Smarter routes and stopovers<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;\">Why each saving works, explained simply<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Booking and more<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Book the flight inside the app<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Step-by-step guide for award bookings<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Price alerts for saved trips<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Saved trips and total saved<\u002Fdiv>\n        <div style=\"font-size:28px;line-height:1.35;padding:15px 0;\">Fully responsive, mobile first<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;color:#A4622E;margin-top:auto\">What else? Think of many more cases.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 22 RULES -->\n  <section data-label=\"Hackathon 1 · Rules and Deliverables\" data-speaker-notes=\"Everyone builds their own version. It must be live and the code must be shared before demo day. On the final day, three minutes each.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Both projects<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Rules and Deliverables<\u002Fh2>\n    <p style=\"font-size:36px;line-height:1.4;color:#3E3529;margin-top:30px\">Individual challenge. Choose one project and build your own version.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:44px 44px 48px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Before demo day<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;margin-top:24px;padding-bottom:18px;border-bottom:1px solid rgba(36,27,18,.12)\">Live URL<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;padding-top:18px\">Code repository<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:24px\">Both shared in advance, so the jury can try the app.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:44px 44px 48px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Final day · 3 minutes each<\u002Fdiv>\n        <div style=\"font-size:32px;font-weight:600;margin-top:24px;padding-bottom:16px;border-bottom:1px solid rgba(36,27,18,.12)\">What you built<\u002Fdiv>\n        <div style=\"font-size:32px;font-weight:600;padding:16px 0;border-bottom:1px solid rgba(36,27,18,.12)\">How you built it<\u002Fdiv>\n        <div style=\"font-size:32px;font-weight:600;padding-top:16px\">What you would do next<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:44px 44px 48px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">The result<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;line-height:1.15;color:#F6F1E9;margin-top:24px\">A jury chooses the best project.<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;line-height:1.15;color:#BE7539;margin-top:18px\">The winner gets a prize.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 23 JURY -->\n  <section data-label=\"Hackathon 1 · What the Jury Looks At\" data-speaker-notes=\"Five things. Completeness alone does not win. Product thinking and how you used AI weigh as much as the code.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 1 · Both projects<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">What the Jury Looks At<\u002Fh2>\n    <div style=\"margin-top:auto;border-top:2px solid #241B12\">\n      <div style=\"display:grid;grid-template-columns:110px 620px 1fr;align-items:baseline;padding:28px 0;border-bottom:1px solid rgba(36,27,18,.12)\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#A4622E\">01<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Completeness<\u002Fspan>\n        <span style=\"font-size:30px;color:#5C5043\">How much of the real flow works, end to end<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:110px 620px 1fr;align-items:baseline;padding:28px 0;border-bottom:1px solid rgba(36,27,18,.12)\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#A4622E\">02<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Product thinking<\u002Fspan>\n        <span style=\"font-size:30px;color:#5C5043\">The cases you found that nobody asked for<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:110px 620px 1fr;align-items:baseline;padding:28px 0;border-bottom:1px solid rgba(36,27,18,.12)\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#A4622E\">03<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Design and taste<\u002Fspan>\n        <span style=\"font-size:30px;color:#5C5043\">Branding, UI, details and mobile experience<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:110px 620px 1fr;align-items:baseline;padding:28px 0;border-bottom:1px solid rgba(36,27,18,.12)\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#A4622E\">04<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Technical quality<\u002Fspan>\n        <span style=\"font-size:30px;color:#5C5043\">Real time, security, scalability and cost<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:110px 620px 1fr;align-items:baseline;padding:28px 0\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#A4622E\">05<\u002Fspan>\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Use of AI<\u002Fspan>\n        <span style=\"font-size:30px;color:#5C5043\">How AI and agents were used along the way<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 24 H2 TITLE -->\n  <section data-label=\"Hackathon 2 · Your Own Project\" data-speaker-notes=\"Now it is your turn to choose. Pick a problem you believe in and show the builder mentality.\" style=\"background:#241B12;color:#F6F1E9;padding:0;box-sizing:border-box;display:flex;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"width:820px;flex-shrink:0;padding:100px 90px 90px 110px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Hackathon 2<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:auto\">Your Own Project<\u002Fh2>\n      <div style=\"width:80px;height:4px;background:#BE7539;margin-top:40px\"><\u002Fdiv>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6;margin-top:36px\">One problem, one clear objective<\u002Fp>\n      <p style=\"font-size:34px;line-height:1.45;color:#C9BBA6\">Built your way<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1;position:relative;background:#2E2318;overflow:hidden\">\n      <div style=\"position:absolute;left:50%;top:50%;width:760px;height:760px;transform:translate(-50%,-50%)\">\n        <svg sc-camel-view-box=\"0 0 120 120\" width=\"760\" height=\"760\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"sx24\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#sx24)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 25 H2 BRIEF -->\n  <section data-label=\"Hackathon 2 · The Brief\" data-speaker-notes=\"Anything you want, as long as the problem is real and the objective is measurable. Delivered the same way as the first hackathon.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 2 · Your own project<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Brief<\u002Fh2>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;font-weight:500;line-height:1.16;letter-spacing:-.025em;margin-top:56px;max-width:1560px\">Choose a real problem with a clear objective, and build the solution end to end.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:36px;margin-top:auto\">\n      <div style=\"border-top:4px solid #BE7539;padding-top:28px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600\">The problem<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#5C5043;margin-top:14px\">Described in a single sentence that anyone understands.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:28px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600\">The objective<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#5C5043;margin-top:14px\">What success looks like, and how you measure it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:28px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600\">The business<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#5C5043;margin-top:14px\">Who it is for, who pays, and how people find it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:28px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600\">The delivery<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#5C5043;margin-top:14px\">A live URL and the code repository, as in Hackathon 1.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 26 H2 EVALUATION -->\n  <section data-label=\"Hackathon 2 · How It Is Evaluated\" data-speaker-notes=\"Every criterion maps to a part of this deck. If you apply what we covered, you will score well. Keep the deck and use it as your checklist.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Hackathon 2 · Your own project<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">How Hackathon 2 Is Evaluated<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 520px;gap:80px;margin-top:50px;flex:1;min-height:0\">\n      <div style=\"border-top:2px solid #241B12\">\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Problem and objective<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Real, clear and measurable<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Business model<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Who pays, and how it reaches users<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Research and references<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Information gathered before building<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Branding and UI<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Good taste and attention to detail<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Flows and features<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Thought through, edge cases included<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Agentic workflow<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Agents, loops and skills in use<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Security, scale and cost<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Ready for real users<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:440px 1fr;align-items:baseline;padding:15px 0\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Delivery<\u002Fspan><span style=\"font-size:27px;color:#5C5043\">Live, fast, responsive and findable<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:50px 48px;display:flex;flex-direction:column;justify-content:flex-end\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">The real question<\u002Fdiv>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;line-heig on:absolute;right:-230px;bottom:-280px;width:980px;height:980px\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"980\" height=\"980\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"mk01\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#mk01)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;gap:18px\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"56\" height=\"56\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"mk01b\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#mk01b)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg><span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:.16em;color:#F6F1E9\">SUSTRAIAK<\u002Fspan><\u002Fdiv>\n    <div style=\"position:relative;margin-top:auto;max-width:1150px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">VKAPS × Sustraiak · Marketing and sales<\u002Fdiv>\n      <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:132px;font-weight:600;letter-spacing:-.035em;line-height:1;color:#F6F1E9;margin-top:30px\">Full Stack Marketing<\u002Fh1>\n      <p style=\"font-size:38px;line-height:1.4;color:#C9BBA6;margin-top:34px;max-width:980px\">How agents create, publish and optimise a complete marketing operation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;margin-top:80px;padding-top:28px;border-top:1px solid rgba(231,214,191,.25);max-width:1150px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Eriz Zarate, CEO<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M02 BEST TIME TO DISTRIBUTE -->\n  <section data-label=\"M · The Best Time to Distribute\" data-speaker-notes=\"Building got cheap. So did distribution. Image, video and audio models plus marketing APIs mean one person can run what used to need an agency.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · Why now<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Best Time on Earth to Distribute<\u002Fh2>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:500;line-height:1.2;letter-spacing:-.02em;margin-top:56px;max-width:1580px\">It is not only building that got cheaper. Reaching customers did too.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:44px;margin-top:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#A4622E\">Create<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Image, video and voice models produce studio-quality content in minutes.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#A4622E\">Publish<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Ad platforms and social tools expose APIs that agents can drive directly.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#241B12;padding:36px 38px 40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#F6F1E9\">Optimise<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:14px\">Agents read the results, learn what works and launch the next version.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M03 NEW OFFER -->\n  <section data-label=\"M · A New Offer for VKAPS\" data-speaker-notes=\"Marketing and sales should be a core priority. AI-run marketing is a new service VKAPS can sell to every client it already builds for. Sustraiak will be the first pilot.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · The opportunity<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">A New Offer for VKAPS Clients<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:90px;margin-top:60px;flex:1;min-height:0\">\n      <div style=\"display:flex;flex-direction:column\">\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:500;line-height:1.18;letter-spacing:-.02em\">Every client who needs a product also needs customers.<\u002Fp>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:30px\">VKAPS already builds the product. Now it can also run the growth, with agents doing most of the work.<\u002Fp>\n        <div style=\"margin-top:auto;border-top:2px solid #241B12\">\n          <div style=\"display:grid;grid-template-columns:360px 1fr;align-items:baseline;gap:30px;padding:19px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:31px;font-weight:600\">Recurring revenue<\u002Fspan><span style=\"font-size:27px;line-height:1.4;color:#5C5043\">A monthly service, not a one-off project<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:360px 1fr;align-items:baseline;gap:30px;padding:19px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:31px;font-weight:600\">Higher retention<\u002Fspan><span style=\"font-size:27px;line-height:1.4;color:#5C5043\">Clients stay while campaigns perform<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:360px 1fr;align-items:baseline;gap:30px;padding:19px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:31px;font-weight:600\">Small team<\u002Fspan><span style=\"font-size:27px;line-height:1.4;color:#5C5043\">Agents carry the volume, people direct<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:54px 56px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">First pilot<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:600;letter-spacing:-.025em;color:#F6F1E9;margin-top:22px\">Sustraiak<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#C9BBA6;margin-top:22px\">We become the first client. VKAPS runs our marketing with this method, and the results become the case study for selling it.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#BE7539;margin-top:auto\">Prove it on us, then sell it to everyone.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M04 SAME PRINCIPLES -->\n  <section data-label=\"M · Same Principles, New Field\" data-speaker-notes=\"Everything from the development session applies: research first, good taste, iterate, build skills, use AI for everything. Only the output changes.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · Same principles<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Same Principles, New Field<\u002Fh2>\n    <p style=\"font-size:34px;line-height:1.45;color:#3E3529;margin-top:28px;max-width:1500px\">Research, taste, iteration and skills work the same way. Only the output changes: campaigns instead of code.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:26px;margin-top:auto\">\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">01<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:8px\">Research<\u002Fdiv><p style=\"font-size:25px;line-height:1.45;color:#5C5043;margin-top:12px\">Market, competitors, audience and their language<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">02<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:8px\">Position<\u002Fdiv><p style=\"font-size:25px;line-height:1.45;color:#5C5043;margin-top:12px\">Offer, message and brand guidelines<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">03<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:8px\">Create<\u002Fdiv><p style=\"font-size:25px;line-height:1.45;color:#5C5043;margin-top:12px\">Ads, posts, videos, emails and landing pages<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">04<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:8px\">Launch<\u002Fdiv><p style=\"font-size:25px;line-height:1.45;color:#5C5043;margin-top:12px\">Publish across every channel at once<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">05<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:8px\">Measure<\u002Fdiv><p style=\"font-size:25px;line-height:1.45;color:#5C5043;margin-top:12px\">Clicks, leads, sales and cost per result<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">06<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;margin-top:8px\">Iterate<\u002Fdiv><p style=\"font-size:25px;line-height:1.45;color:#5C5043;margin-top:12px\">Keep the winners, replace the losers, repeat<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M05 STACK -->\n  <section data-label=\"M · Claude Code, Skills and MCPs\" data-speaker-notes=\"Claude Code is not only for code. With skills it knows how to do marketing work; with MCPs it can operate the platforms. Explain MCP as a plug that gives the agent hands on a tool.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · The stack<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Claude Code, Skills and MCPs<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;margin-top:56px\">\n      <div style=\"background:#241B12;padding:38px 40px 42px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BE7539\">The brain<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;color:#F6F1E9;margin-top:16px\">Claude Code<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#C9BBA6;margin-top:14px\">Plans, writes, analyses and decides what to do next.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:38px 40px 42px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">The know-how<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;margin-top:16px\">Skills<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Your playbooks: brand voice, ad formats, reporting, campaign rules.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:38px 40px 42px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">The hands<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;margin-top:16px\">MCPs and APIs<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#3E3529;margin-top:14px\">Plugs that let the agent operate each platform directly.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">What it can operate<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:22px\">\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Google Ads<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Meta Ads<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">LinkedIn Ads<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Email<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Social publishing<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Analytics<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">CRM<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Website and landing pages<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M06 HARNESS -->\n  <section data-label=\"M · What Is a Harness\" data-speaker-notes=\"Simple version: the agent is the driver, the harness is the car. It gives the agent a goal, access to the tools, the data, a memory of what worked, and limits it cannot cross. Without a harness the agent only answers; with one it runs the campaign.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · The harness<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">What Is a Harness?<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:720px 1fr;gap:100px;margin-top:50px;flex:1;min-height:0\">\n      <div style=\"display:flex;flex-direction:column\">\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:500;line-height:1.18;letter-spacing:-.02em\">The agent is the driver. The harness is the car.<\u002Fp>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:30px\">It is everything you build around the agent so it can work alone, safely, towards a goal, and get better every time.<\u002Fp>\n        <div style=\"margin-top:auto;background:#241B12;padding:32px 36px\">\n          <p style=\"font-size:30px;line-height:1.45;color:#C9BBA6\">Without a harness, the agent answers questions.<\u002Fp>\n          <p style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;color:#BE7539;margin-top:10px\">With one, it runs the campaign.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #241B12\">\n        <div style=\"padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">A goal<\u002Fdiv><p style=\"font-size:27px;line-height:1.4;color:#5C5043;margin-top:6px\">One number to improve: leads, sales, cost per acquisition<\u002Fp><\u002Fdiv>\n        <div style=\"padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Connections<\u002Fdiv><p style=\"font-size:27px;line-height:1.4;color:#5C5043;margin-top:6px\">MCPs and APIs to every ad platform and channel<\u002Fp><\u002Fdiv>\n        <div style=\"padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Data<\u002Fdiv><p style=\"font-size:27px;line-height:1.4;color:#5C5043;margin-top:6px\">Daily results pulled from analytics and the ad accounts<\u002Fp><\u002Fdiv>\n        <div style=\"padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Memory<\u002Fdiv><p style=\"font-size:27px;line-height:1.4;color:#5C5043;margin-top:6px\">A log of every test, what won and why<\u002Fp><\u002Fdiv>\n        <div style=\"padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600\">Rules<\u002Fdiv><p style=\"font-size:27px;line-height:1.4;color:#5C5043;margin-top:6px\">Budget caps, brand guidelines and what needs human approval<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- M07 LEARNING LOOP -->\n  <section data-label=\"M · Campaigns That Learn\" data-speaker-notes=\"This is the core of the method. Set an objective, let the agent create variants, launch them, read the results and learn. Every cycle the campaign gets better, without someone rebuilding it by hand.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · The loop<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Campaigns That Learn on Their Own<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1fr 46px 1fr 46px 1fr 46px 1fr;margin-top:64px\">\n      <div style=\"background:#241B12;padding:28px 26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#F6F1E9\">Objective<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#C9BBA6;margin-top:8px\">Conversions, purchases or booked calls<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:34px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#241B12\">Generate<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:8px\">Many variants of copy, image and audience<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:34px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#241B12\">Launch<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:8px\">Small budget per variant<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:34px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#241B12\">Measure<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:8px\">Cost per result after a set period<\u002Fp><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:34px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 26px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#241B12\">Learn<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:8px\">Scale winners, pause losers, note why<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:64px;margin:0 9%;border:3px dashed #BE7539;border-top:none;border-radius:0 0 18px 18px\"><\u002Fdiv>\n    <p style=\"text-align:center;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;color:#A4622E;margin-top:16px\">Repeat daily or weekly<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:auto;padding-top:30px;border-top:2px solid #241B12\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Clear objective<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:8px\">One metric, so the agent knows what better means.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Enough volume<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:8px\">Test many variants, since content now costs almost nothing.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Written memory<\u002Fdiv><p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:8px\">Each cycle starts from what the last one learned.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- MA TOOLING AND TASTE -->\n  <section data-label=\"M · Tooling and Taste\" data-speaker-notes=\"The two things that make this work. Tooling lets you produce and optimise at scale. Taste decides whether what you produce actually sells. Tools can be copied; taste cannot. Together they are what lets us perform for customers.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Marketing · What makes it work<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Tooling and Taste<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:50px\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:44px 48px 40px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Tooling<\u002Fdiv>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;line-height:1.15;margin-top:18px\">Lets you produce and optimise at scale.<\u002Fp>\n        <div style=\"margin-top:26px\"><div style=\"display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">The harness, skills and MCPs<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Hundreds of variants without extra people<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Results read and acted on every day<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:44px 48px 40px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Taste<\u002Fdiv>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;line-height:1.15;margin-top:18px;color:#F6F1E9\">Decides whether any of it sells.<\u002Fp>\n        <div style=\"margin-top:26px\"><div style=\"display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(231,214,191,.2)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4;color:#F6F1E9\">Knowing which hook stops the scroll<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(231,214,191,.2)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4;color:#F6F1E9\">Ads that look like the brand, not like AI<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(231,214,191,.2)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4;color:#F6F1E9\">Choosing what to test, and what to drop<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#A4622E;margin-top:auto\">Anyone can generate an ad. Few can generate one that sells.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- MB EASY TO SELL -->\n  <section data-label=\"M · Easy to Sell, Hard to Copy\" data-speaker-notes=\"Sell something that is easy to sell. Every business wants more customers, few companies do this well yet, and doing it well needs taste, so it is hard to copy. And the results are measurable, which makes renewals easy.\" style=\"background:#241B12;color:#F6F1E9;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Marketing · The offer<\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.035em;line-height:1.04;color:#F6F1E9;margin-top:auto;max-width:1600px\">Sell something easy to sell, and hard to copy.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:44px;margin-top:80px;padding-top:36px;border-top:1px solid rgba(231,214,191,.25)\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:60
