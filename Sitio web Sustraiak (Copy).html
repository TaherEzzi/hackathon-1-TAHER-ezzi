und:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 30px 30px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Admin<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Dashboard<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Roles and permissions<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Settings and reports<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 30px 30px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Platform<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Database and APIs<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Integrations<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Files and storage<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 30px 30px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Quality<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Automated tests<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Error tracking<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Performance checks<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 30px 30px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Operations<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Hosting and CI/CD<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Backups<\u002Fdiv><div style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Analytics and cost<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 01 · Research and References\" data-speaker-notes=\"Never start from a blank page. Spend the first hours understanding the business and collecting the best references. AI does the research in minutes.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 01 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:9%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Research and References<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Understand the business, the users and the problem first.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Study the ten best products and what users complain about.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Collect the flows and pages you want to match or beat.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Where to look<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Mobbin<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Real app screens and user flows<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Page Flows<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Recorded journeys of real products<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Godly · Awwwards<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">The best websites, curated<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Land-book<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Landing pages by industry<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">AI research<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Market, competitors, user reviews<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Act as a product strategist. Research how [industry] businesses handle [problem]. List the ten best products, what each one does well, the most common user complaints, and the features nobody offers yet.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 02 · Brand\" data-speaker-notes=\"Even internal tools deserve a brand. A small brand system defined early makes every screen faster to design and more consistent.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 02 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:18%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Brand<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Define the personality first, then colour, type and logo.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Build a small brand system before the first screen.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Apply it everywhere, from the app to the emails.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Where to look<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Brand New<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Reviews of real brand identities<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Behance<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Full identity case studies<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Fonts In Use<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Typography in real projects<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Realtime Colors<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Test a palette on a live page<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Fontshare<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Free, high-quality typefaces<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Create a brand identity for [business]: its personality in three words, a colour palette with hex codes and when to use each, two font pairings from Google Fonts, the tone of voice with examples, and three logo directions.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 03 · UI and Components\" data-speaker-notes=\"21st.dev gives you components with a prompt you can copy straight into your agent. Start there, adapt to the brand, and keep one design system.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 03 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:27%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">UI and Components<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Start from proven components, never from a blank file.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Adapt them to the brand and keep one design system.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Design every state: hover, focus, loading, empty, error.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Where to look<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">21st.dev<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Components, each with a ready prompt<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">shadcn/ui<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Accessible base components<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Magic UI · Aceternity<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Animated modern sections<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">v0<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Generate UI from a description<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Lucide · Phosphor<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Consistent icon sets<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Using shadcn/ui and Tailwind, build a [component] for this brand: [colours, fonts]. Include hover, focus, loading, empty and error states, keyboard access, and make it fully responsive from 360 px wide.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 04 · Flows and Features\" data-speaker-notes=\"Flows before screens. Ask AI to find the edge cases you missed; it is very good at that. Then cut everything that does not serve the objective.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 04 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:36%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Flows and Features<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Map every journey for every role before drawing screens.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Write the happy path, the edge cases and the failures.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Fewer features, finished properly, beat many half done.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Tools<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Mobbin flows<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">How top apps solve the journey<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">FigJam · Whimsical<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Fast flow diagrams<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">AI as a critic<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Finds the cases you missed<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Real users<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Five minutes beats a day of guessing<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">List every user flow in [product] for each role: customer, staff and admin. For each flow give the happy path, the edge cases, the failure cases, and exactly what the user sees in each one.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 05 · Motion and Modern Feel\" data-speaker-notes=\"Motion is what makes a product feel modern and premium, but only when it is fast and has a purpose. Never animate for decoration alone.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 05 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:45%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Motion and Modern Feel<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Use motion to explain what changed and what comes next.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Keep it fast, 150 to 300 ms, and never block the user.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Respect reduced-motion settings and stay at 60 fps.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Where to look<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Motion<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Animation for React<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">GSAP<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Scroll and timeline animation<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Rive · LottieFiles<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Interactive vector animation<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">View Transitions<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Native page transitions<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Codrops<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Modern interaction experiments<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Add subtle motion to this page with Motion for React: staggered reveals on scroll, smooth transitions between pages, and micro-interactions on buttons and cards. Keep durations under 300 ms and respect prefers-reduced-motion.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 06 · Platform and Technology\" data-speaker-notes=\"Pick the language for the problem. TypeScript for the product, Python where there is AI or data, Go or Rust only when performance demands it. Ask AI to justify every choice.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 06 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:55%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Platform and Technology<\u002Fh2>\n    <div style=\"margin-top:44px\">\n      <div style=\"display:grid;grid-template-columns:640px 1fr;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\"><span>When the project needs<\u002Fspan><span>Choose<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">Web apps and dashboards<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">TypeScript · React · Next.js<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">APIs and business logic<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">TypeScript (Node.js) or Python (FastAPI)<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">AI, data and automation<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">Python<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">High performance and concurrency<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">Go or Rust<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">Mobile apps<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">React Native with Expo · Swift or Kotlin for native<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">Data<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">PostgreSQL (Supabase) · Redis for cache and queues<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:640px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600\">Real time<\u002Fspan><span style=\"font-size:28px;color:#3E3529\">WebSockets · Supabase Realtime<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">I am building [product] with [users, real time, payments, AI]. Propose the architecture, the stack with the reason for each choice, the data model and the main API endpoints. Highlight the risks and what changes at ten times the users.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 07 · Admin and Roles\" data-speaker-notes=\"The admin is the product the client uses every day. If the owner has to call a developer to change a setting, the admin is not finished.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 07 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:64%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Admin and Roles<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Treat the admin as a product for the owner.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Define roles and permissions from day one.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Let the owner change settings without a developer.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Every admin needs<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Dashboard<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">The numbers that matter today<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Roles<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Who can see and do what<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Search and bulk actions<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Manage hundreds of items fast<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Audit log<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Who changed what, and when<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Settings<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Changed by the owner, no code<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Design the admin panel for [product]: the roles and what each one can do, the dashboard metrics, management screens with search, filters and bulk actions, an audit log, and the settings the owner can change without a developer.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 08 · Security\" data-speaker-notes=\"AI writes code fast, and it will also write insecure code fast if you let it. Run a security review on every project before delivery.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 08 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:73%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Security<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Never build your own authentication.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Check permissions on every request, on the server.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Treat every input as hostile and every secret as private.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Checklist<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Authentication<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Supabase Auth, Clerk or Auth.js<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Authorisation<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Row-level security, server checks<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Validation<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Zod or Pydantic on every input<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Secrets<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Environment variables, never Git<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Protection<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Rate limits, headers, Dependabot<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Act as a security auditor. Review this codebase against the OWASP Top 10. List every vulnerability with its severity, file and line, and the exact fix. Then apply the fixes and confirm each one.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 09 · Scalability and Cost\" data-speaker-notes=\"Design for ten times the users, but do not over-engineer. And always know the monthly cost per user, including AI calls.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 09 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:82%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Scalability and Cost<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">What to do<\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Design for ten times the users, build for today.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Measure before optimising: queries, payloads, timings.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"width:22px;height:4px;background:#BE7539;flex-shrink:0;transform:translateY(-8px)\"><\u002Fspan><p style=\"font-size:29px;line-height:1.4\">Know what each user costs you every month.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Where it matters<\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Database<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Indexes and efficient queries<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Caching<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Redis and a CDN for static files<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Queues<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Heavy work out of the request<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">AI costs<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Smaller models, cached answers<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;white-space:nowrap\">Budgets<\u002Fspan><span style=\"font-size:24px;line-height:1.35;color:#5C5043\">Alerts on every cloud account<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:36px;flex-shrink:0\"><\u002Fdiv><div style=\"margin-top:auto;background:#241B12;padding:28px 36px 32px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">Prompt to copy<\u002Fdiv><p style=\"font-family:'JetBrains Mono',monospace;font-size:25px;line-height:1.5;color:#EDE3D3;margin-top:12px\">Analyse this architecture for 100 times the traffic. Identify the bottlenecks, the queries that need indexes, and what should be cached or queued. Estimate the monthly cost at 1,000, 10,000 and 100,000 users.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 10 · Quality First\" data-speaker-notes=\"Stop here and make this point strongly. Bugs are the most disturbing thing for a client. They forget a beautiful design; they never forget the bug in the demo.\" style=\"background:#241B12;color:#F6F1E9;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#C9BBA6\">Stage 10 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:rgba(231,214,191,.2)\"><div style=\"width:91%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:124px;font-weight:600;letter-spacing:-.035em;line-height:1.02;color:#F6F1E9;margin-top:auto;max-width:1500px\">Bugs are what clients remember.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:56px;margin-top:90px;padding-top:36px;border-top:1px solid rgba(231,214,191,.25)\">\n      <p style=\"font-size:32px;line-height:1.45;color:#C9BBA6\">One bug in a demo can undo weeks of good work.<\u002Fp>\n      <p style=\"font-size:32px;line-height:1.45;color:#C9BBA6\">AI lets us write code faster, so we have to test more, not less.<\u002Fp>\n      <p style=\"font-size:32px;line-height:1.45;color:#C9BBA6\">Excellent quality is how we win the next project.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Stage 10 · Testing Every Layer\" data-speaker-notes=\"Ask the agent to write the tests together with the feature, run them, and fix until they pass. Nothing is done until it meets the definition of done.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv><div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#5C5043\">Stage 10 / 11<\u002Fspan><div style=\"width:240px;height:6px;background:#E7D6BF\"><div style=\"width:91%;height:100%;background:#BE7539\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Testing Every Layer<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 470px;gap:64px;margin-top:44px\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;padding-bottom:14px;border-bottom:2px solid #241B12\">Test layers<\u002Fdiv><div style=\"display:grid;grid-template-columns:330px 300px 1fr;align-items: -items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Icons<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Lucide · Phosphor<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:300px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Build with AI<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Claude Code · Cursor · v0 · Lovable<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:300px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Test and monitor<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Playwright · Vitest · Sentry<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:300px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Deploy<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600\">Vercel · Netlify · Railway · Supabase<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 SECTION 03 -->\n  <section data-label=\"04 Further Efficiency\" data-speaker-notes=\"Part three: once the process is clear, how to multiply it.\" style=\"background:#241B12;color:#F6F1E9;padding:110px;box-sizing:border-bo
