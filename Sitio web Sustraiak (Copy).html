document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F1E9\">Demo day<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.35;margin-top:12px;color:#C9BBA6\">Hackathon 1: 3 min each<\u002Fdiv><div style=\"font-size:24px;line-height:1.35;margin-top:12px;color:#C9BBA6\">Hackathon 2 presentations<\u002Fdiv><div style=\"font-size:24px;line-height:1.35;margin-top:12px;color:#C9BBA6\">Winner, prize, next steps<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;margin-top:26px\">\n      <span style=\"width:32px;height:4px;background:#BE7539;flex-shrink:0\"><\u002Fspan>\n      <p style=\"font-size:28px;color:#3E3529\"><span style=\"font-weight:700\">Both hackathons are open from day one.<\u002Fspan> Ask anything, anytime: in the office, by chat or in the group.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 SECTION 01 -->\n  <section data-label=\"01 Where We Are\" data-speaker-notes=\"Part one: where we are and why now.\" style=\"background:#241B12;color:#F6F1E9;padding:110px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"position:absolute;right:-220px;bottom:-300px;width:900px;height:900px\">\n      <svg sc-camel-view-box=\"0 0 120 120\" width=\"900\" height=\"900\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"sx03\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#sx03)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:1100px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:200px;font-weight:700;color:#BE7539;line-height:.9;letter-spacing:-.04em\">01<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:40px\">Where We Are<\u002Fh2>\n      <p style=\"font-size:34px;line-height:1.4;color:#C9BBA6;margin-top:28px\">Current situation · The best time to build · Full stack · Thinking like a founder<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 WHERE WE ARE TODAY -->\n  <section data-label=\"Where We Are Today\" data-speaker-notes=\"Be honest and constructive here. This is not about doing worse; it is about how much more is now possible. Adapt the left column to what you see in the team.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">01 · Where we are<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Where We Are Today<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 90px 1fr;margin-top:64px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5C5043;padding-bottom:18px;border-bottom:2px solid #241B12\">Today<\u002Fdiv>\n      <div style=\"border-bottom:2px solid #241B12\"><\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;padding-bottom:18px;border-bottom:2px solid #241B12\">Where we are going<\u002Fdiv>\n\n      <div style=\"font-size:33px;line-height:1.35;color:#5C5043;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\">AI is used now and then, mostly for code snippets<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12);text-align:center\">→<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.35;font-weight:600;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\">AI in every step, from research to delivery<\u002Fdiv>\n\n      <div style=\"font-size:33px;line-height:1.35;color:#5C5043;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\">We wait for a full specification before starting<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12);text-align:center\">→<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.35;font-weight:600;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\">We propose, prototype and bring our own ideas<\u002Fdiv>\n\n      <div style=\"font-size:33px;line-height:1.35;color:#5C5043;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Speed depends on the hours we spend typing<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12);text-align:center\">→<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.35;font-weight:600;padding:26px 0;border-bottom:1px solid rgba(36,27,18,.12)\">Speed depends on the quality of our thinking<\u002Fdiv>\n\n      <div style=\"font-size:33px;line-height:1.35;color:#5C5043;padding:26px 0\">Design, SEO and performance belong to someone else<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539;padding:26px 0;text-align:center\">→<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.35;font-weight:600;padding:26px 0\">Every developer owns the whole product<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 BEST TIME TO BUILD -->\n  <section data-label=\"The Best Time on Earth to Build\" data-speaker-notes=\"The bottleneck has moved from typing to thinking. Whoever thinks best and uses the tools best will build the most.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">01 · Where we are<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">The Best Time on Earth to Build<\u002Fh2>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:500;line-height:1.2;letter-spacing:-.02em;margin-top:56px;max-width:1500px\">One person with AI can now build what used to take a whole team.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:40px 40px 44px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;color:#A4622E\">Knowledge<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#3E3529;margin-top:18px\">Any answer is one question away, in any domain.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:40px 40px 44px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;color:#A4622E\">Execution<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#3E3529;margin-top:18px\">Agents write, test and refactor code with you.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:40px 40px 44px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:600;color:#A4622E\">Delivery<\u002Fdiv>\n        <p style=\"font-size:30px;line-height:1.45;color:#3E3529;margin-top:18px\">A product can be live worldwide in minutes, at almost no cost.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 FULL STACK -->\n  <section data-label=\"Everyone Can Be Full Stack\" data-speaker-notes=\"Nobody is only frontend or only backend any more. With AI as a senior partner in every layer, each of us can deliver the complete product.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">01 · Where we are<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Everyone Can Be Full Stack<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:90px;margin-top:56px;flex:1;min-height:0\">\n      <div style=\"display:flex;flex-direction:column;justify-content:center\">\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:500;line-height:1.18;letter-spacing:-.02em\">You don't need to master every layer.<\u002Fp>\n        <p style=\"font-size:34px;line-height:1.45;color:#5C5043;margin-top:32px\">You need to know what to ask, and how to judge the answer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Product and UX<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Branding and UI<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Frontend<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Backend and APIs<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Data<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Infrastructure and DevOps<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">Security<\u002Fdiv>\n          <div style=\"flex:1;display:flex;align-items:center;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:0 28px;font-size:28px;font-weight:600\">SEO and performance<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:96px;background:#BE7539;display:flex;align-items:center;justify-content:center\">\n          <span style=\"writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#241B12\">AI in every layer<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PRODUCT SENSE -->\n  <section data-label=\"Product Sense Matters Most\" data-speaker-notes=\"This is the key idea of the whole week. Technical skill without product sense builds the wrong thing very well. Product sense can be learned, and AI closes the technical gap faster than ever.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">01 · Where we are<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Product Sense Matters Most<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 860px;gap:90px;margin-top:44px;flex:1;min-height:0\">\n      <div style=\"display:flex;flex-direction:column;justify-content:center\">\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:500;line-height:1.16;letter-spacing:-.02em\">A developer without product sense is worse than an average developer with it.<\u002Fp>\n        <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:32px\">AI closes the technical gap faster every month. Knowing what to build, and why, is what makes the difference.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:60px 1fr;grid-template-rows:1fr 54px\">\n        <div style=\"display:flex;align-items:center;justify-content:center\"><span style=\"writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Technical skill →<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px\">\n          <div style=\"background:#E7D6BF;padding:34px 36px;display:flex;flex-direction:column;justify-content:flex-end\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;line-height:1.15;color:#241B12\">Builds the wrong thing, very well<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#3E3529;margin-top:10px\">Great code nobody needs<\u002Fp><\u002Fdiv>\n          <div style=\"background:#241B12;padding:34px 36px;display:flex;flex-direction:column;justify-content:flex-end\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;line-height:1.15;color:#BE7539\">The 10X builder<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#C9BBA6;margin-top:10px\">The right product, built properly<\u002Fp><\u002Fdiv>\n          <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:34px 36px;display:flex;flex-direction:column;justify-content:flex-end\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;line-height:1.15;color:#241B12\">Starting point<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">Where everyone begins<\u002Fp><\u002Fdiv>\n          <div style=\"background:#FBF8F2;border:2px solid #BE7539;padding:34px 36px;display:flex;flex-direction:column;justify-content:flex-end\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;line-height:1.15;color:#241B12\">Builds the right thing, and grows<\u002Fdiv><p style=\"font-size:24px;line-height:1.4;color:#5C5043;margin-top:10px\">AI fills the technical gaps<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E\">Product sense →<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOUNDER -->\n  <section data-label=\"Thinking Like a Founder\" data-speaker-notes=\"Being a good developer is not enough. Every one of you can be an entrepreneur: you can build a complete product alone. That means thinking about the product, the market and the business, not only the code.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">01 · Where we are<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Thinking Like a Founder<\u002Fh2>\n    <p style=\"font-size:32px;line-height:1.45;color:#5C5043;margin-top:22px\">Being a good developer is the first step, not the last one.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:18px;align-items:end;margin-top:auto\">\n      <div style=\"height:280px;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:26px 24px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">01<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.15;margin-top:8px;color:#241B12\">Code<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.4;margin-top:12px;color:#5C5043\">Does it work, and is it solid?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:330px;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:26px 24px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">02<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.15;margin-top:8px;color:#241B12\">Product<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.4;margin-top:12px;color:#5C5043\">What problem, for whom, and why now?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:380px;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:26px 24px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">03<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.15;margin-top:8px;color:#241B12\">Design<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.4;margin-top:12px;color:#5C5043\">Is it clear, simple and beautiful?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:430px;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:26px 24px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">04<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.15;margin-top:8px;color:#241B12\">Marketing<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.4;margin-top:12px;color:#5C5043\">How will people find it and choose it?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:480px;background:#FBF8F2;border:1px solid rgba(36,27,18,.12);border-top:4px solid #BE7539;padding:26px 24px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">05<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.15;margin-top:8px;color:#241B12\">Business model<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.4;margin-top:12px;color:#5C5043\">Who pays, how much, and why?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"height:530px;background:#241B12;border-top:4px solid #BE7539;padding:26px 24px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">06<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600;line-height:1.15;margin-top:8px;color:#F6F1E9\">Metrics<\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.4;margin-top:12px;color:#C9BBA6\">How do we know it is working?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;color:#A4622E;margin-top:40px\">Every one of you can be an entrepreneur. The tools are already in your hands.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 07 SECTION 02 -->\n  <section data-label=\"02 The Builder Process\" data-speaker-notes=\"Part two: the process. Be proactive and own the project from the first idea to delivery.\" style=\"background:#241B12;color:#F6F1E9;padding:110px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"position:absolute;right:-220px;bottom:-300px;width:900px;height:900px\">\n      <svg sc-camel-view-box=\"0 0 120 120\" width=\"900\" height=\"900\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"sx07\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#sx07)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:1100px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:200px;font-weight:700;color:#BE7539;line-height:.9;letter-spacing:-.04em\">02<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:40px\">The Builder Process<\u002Fh2>\n      <p style=\"font-size:34px;line-height:1.4;color:#C9BBA6;margin-top:28px\">Be proactive and own the project, end to end<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 PROCESS -->\n  <section data-label=\"The Builder Process\" data-speaker-notes=\"Twelve steps in five stages. Coding is only one of them. Most of the quality is decided before the first line of code and after the last one.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">02 · The builder process<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">From Idea to Delivery in Twelve Steps<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:26px;margin-top:70px\">\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;margin-bottom:6px\">Understand<\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">01<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Find information<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">02<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Find references<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">03<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Ask AI<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;margin-bottom:6px\">Design<\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">04<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Branding<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">05<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">UI<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">06<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Flows and features<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;margin-bottom:6px\">Build<\u002Fdiv>\n        <div style=\"background:#241B12;padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">07<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2;color:#F6F1E9\">Code with agents<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;margin-bottom:6px\">Harden<\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">08<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Security<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">09<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Scalability<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">10<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Cost optimisation<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">11<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Testing and QA<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:4px solid #BE7539;padding-top:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A4622E;margin-bottom:6px\">Ship<\u002Fdiv>\n        <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:22px 24px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">12<\u002Fdiv><div style=\"font-size:30px;font-weight:600;margin-top:6px;line-height:1.2\">Delivery<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 09 USE AI FOR EVERYTHING -->\n  <section data-label=\"Use AI for Everything\" data-speaker-notes=\"The single most important rule. Not knowing is no longer a blocker. Ten minutes stuck without asking is ten minutes wasted.\" style=\"background:#241B12;color:#F6F1E9;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BE7539\">02 · Use AI for everything<\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:112px;font-weight:600;letter-spacing:-.035em;line-height:1.04;color:#F6F1E9;margin-top:auto;max-width:1560px\">If you don't know something, find it with AI.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:44px;margin-top:90px;padding-top:36px;border-top:1px solid rgba(231,214,191,.25)\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#BE7539\">New domain?<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Ask how that business really works.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#BE7539\">New technology?<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Ask for the best options and why.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#BE7539\">An error?<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Paste it with context and ask.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:600;color:#BE7539\">Stuck?<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#C9BBA6;margin-top:12px\">Ten minutes without progress means ask.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 THINK THE WHOLE PROJECT -->\n  <section data-label=\"Think the Whole Project\" data-speaker-notes=\"Inspiration, thinking, planning and architecture come before code. Then think of the project all round, as the client and the end user will experience it.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">02 · The builder process<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Think the Whole Project<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 50px 1fr 50px 1fr 50px 1fr;align-items:stretch;margin-top:60px\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:30px 30px 34px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Inspiration<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:12px\">Study the best products in the space.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:30px 30px 34px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Thinking<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:12px\">Understand the problem and the people.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:30px 30px 34px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Planning<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:12px\">Break the work into steps before coding.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:36px;color:#BE7539\">→<\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.1);padding:30px 30px 34px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600\">Architecture<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.45;color:#5C5043;margin-top:12px\">Choose a structure that will scale.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">Then cover every angle<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:22px\">\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">SEO<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Loading speed<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Branding<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Responsive design<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Accessibility<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Copywriting<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Analytics<\u002Fspan>\n        <span style=\"font-size:30px;font-weight:600;padding:14px 28px;border:1.5px solid #241B12;border-radius:999px\">Security<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#A4622E;margin-top:44px\">Be detailed. Have good taste.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10B FOUR LAYERS -->\n  <section data-label=\"Think Beyond the Request\" data-speaker-notes=\"Four layers for every project. Do not give them the answers; let them work it out during the hackathon. Examples for you, using Iturrieta: 1, they ask for a table booking system. 2, what they really want is fewer no-shows and less time on the phone. 3, what they do not know they need: an AI voice agent taking bookings at night, deposits, a waitlist. 4, what others need: a pastry shop with pre-orders, a winery with tours, any business that takes bookings. Then push parallel thinking and out of the box.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">02 · The builder process<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Think Beyond the Request<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px;flex:1;min-height:0\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:36px 34px 38px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">01<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;line-height:1.15;margin-top:12px;color:#241B12\">What they ask for<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.4;color:#5C5043;margin-top:12px\">The brief. Necessary, but everyone delivers this.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;line-height:1.35;color:#A4622E;margin-top:auto;padding-top:22px;border-top:1px solid rgba(36,27,18,.12)\">Read the brief twice.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:36px 34px 38px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">02<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;line-height:1.15;margin-top:12px;color:#241B12\">What they want but did not say<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.4;color:#5C5043;margin-top:12px\">The problem behind the request.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;line-height:1.35;color:#A4622E;margin-top:auto;padding-top:22px;border-top:1px solid rgba(36,27,18,.12)\">Ask why behind every request.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:36px 34px 38px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#A4622E\">03<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;line-height:1.15;margin-top:12px;color:#241B12\">What they do not know they need<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.4;color:#5C5043;margin-top:12px\">What you see because you know the tools.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;line-height:1.35;color:#A4622E;margin-top:auto;padding-top:22px;border-top:1px solid rgba(36,27,18,.12)\">What could you add that they have never seen?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#241B12;padding:36px 34px 38px;display:flex;flex-direction:column\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#BE7539\">04<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;line-height:1.15;margin-top:12px;color:#F6F1E9\">What others would need<\u002Fdiv>\n        <p style=\"font-size:26px;line-height:1.4;color:#C9BBA6;margin-top:12px\">The same product for other businesses.<\u002Fp>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;line-height:1.35;color:#BE7539;margin-top:auto;padding-top:22px;border-top:1px solid rgba(231,214,191,.25)\">Who else has the same problem?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:40px;padding-top:30px;border-top:2px solid #241B12\">\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Parallel thinking<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#5C5043;margin-top:8px\">Explore several solutions at once, with agents if needed, before choosing one.<\u002Fp><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:600\">Out of the box<\u002Fdiv><p style=\"font-size:27px;line-height:1.45;color:#5C5043;margin-top:8px\">Ask what the obvious answer misses, and what nobody in the sector has tried yet.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 GOOD TASTE -->\n  <section data-label=\"Good Taste Is in the Details\" data-speaker-notes=\"Good taste is visible in the small things. These six are where most products fall short, and where the user notices first.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">02 · The builder process<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px\">Good Taste Is in the Details<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:auto;border-top:2px solid #241B12\">\n      <div style=\"padding:38px 40px 42px 0;border-bottom:1px solid rgba(36,27,18,.12)\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Empty states<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#5C5043;margin-top:12px\">Guide the user when there is no data yet.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:38px 40px 42px;border-bottom:1px solid rgba(36,27,18,.12);border-left:1px solid rgba(36,27,18,.12)\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Loading states<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#5C5043;margin-top:12px\">Never leave the user looking at a blank screen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:38px 0 42px 40px;border-bottom:1px solid rgba(36,27,18,.12);border-left:1px solid rgba(36,27,18,.12)\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Error messages<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#5C5043;margin-top:12px\">Written for people, always with a way out.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:38px 40px 42px 0\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Mobile first<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#5C5043;margin-top:12px\">Designed for the phone, then for the desktop.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:38px 40px 42px;border-left:1px solid rgba(36,27,18,.12)\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Consistency<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#5C5043;margin-top:12px\">The same spacing, type and colours everywhere.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:38px 0 42px 40px;border-left:1px solid rgba(36,27,18,.12)\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600\">Real content<\u002Fdiv>\n        <p style=\"font-size:28px;line-height:1.45;color:#5C5043;margin-top:12px\">Real copy and images, never placeholder text.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- DEVELOPING TASTE -->\n  <section data-label=\"Developing Good Taste\" data-speaker-notes=\"This is key. Tools and code can be copied, taste cannot. It is built by looking at great work every day, and by sharing yours and learning from others.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">02 · The builder process<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Developing Good Taste<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 860px;gap:90px;margin-top:auto;margin-bottom:auto\">\n      <div>\n        <p style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:500;line-height:1.15;letter-spacing:-.02em\">Good taste is the one skill nobody can copy from you.<\u002Fp>\n        <p style=\"font-size:31px;line-height:1.45;color:#5C5043;margin-top:30px\">It is built slowly, by looking at great work every day, and it is the first thing a client notices.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"border-top:2px solid #241B12\">\n          <div style=\"display:grid;grid-template-columns:170px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#A4622E\">Watch<\u002Fspan><span style=\"font-size:29px;line-height:1.4\">Great products, launches and design talks<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:170px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#A4622E\">Read<\u002Fspan><span style=\"font-size:29px;line-height:1.4\">Case studies, changelogs and engineering blogs<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:170px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#A4622E\">Follow<\u002Fspan><span style=\"font-size:29px;line-height:1.4\">Builders and designers who ship every week<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:170px 1fr;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(36,27,18,.12)\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:600;color:#A4622E\">Share<\u002Fspan><span style=\"font-size:29px;line-height:1.4\">Show your work, review others, learn from both<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E;margin-top:34px\">People worth following<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:16px\"><span style=\"font-size:25px;font-weight:600;padding:10px 20px;border:1.5px solid #241B12;border-radius:999px\">Andrej Karpathy<\u002Fspan><span style=\"font-size:25px;font-weight:600;padding:10px 20px;border:1.5px solid #241B12;border-radius:999px\">Simon Willison<\u002Fspan><span style=\"font-size:25px;font-weight:600;padding:10px 20px;border:1.5px solid #241B12;border-radius:999px\">Guillermo Rauch<\u002Fspan><span style=\"font-size:25px;font-weight:600;padding:10px 20px;border:1.5px solid #241B12;border-radius:999px\">Emil Kowalski<\u002Fspan><span style=\"font-size:25px;font-weight:600;padding:10px 20px;border:1.5px solid #241B12;border-radius:999px\">Pieter Levels<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PART 03 FROM ZERO TO PRODUCT -->\n  <section data-label=\"03 From Zero to Product\" data-speaker-notes=\"Part three. The most important part of the week: how to think about a project from zero to a finished product, with every layer owned by one builder.\" style=\"background:#241B12;color:#F6F1E9;padding:110px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"position:absolute;right:-220px;bottom:-300px;width:900px;height:900px\"><svg sc-camel-view-box=\"0 0 120 120\" width=\"900\" height=\"900\" aria-hidden=\"true\" style=\"display:block\"><defs><clipPath id=\"sxP3\"><circle cx=\"60\" cy=\"60\" r=\"58\"><\u002Fcircle><\u002FclipPath><\u002Fdefs><g clip-path=\"url(#sxP3)\"><rect width=\"120\" height=\"120\" fill=\"#E7D6BF\"><\u002Frect><path d=\"M0,46 C26,34 50,40 72,46 C92,51 112,42 120,40 L120,120 L0,120 Z\" fill=\"#D8BE9C\"><\u002Fpath><path d=\"M0,64 C28,52 48,62 70,64 C94,66 110,58 120,60 L120,120 L0,120 Z\" fill=\"#CBA079\"><\u002Fpath><path d=\"M0,82 C24,72 52,82 76,82 C98,82 112,76 120,78 L120,120 L0,120 Z\" fill=\"#BE7539\"><\u002Fpath><path d=\"M0,98 C30,90 54,98 80,98 C100,98 112,94 120,96 L120,120 L0,120 Z\" fill=\"#A4622E\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n    <div style=\"position:relative;max-width:1100px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:200px;font-weight:700;color:#BE7539;line-height:.9;letter-spacing:-.04em\">03<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#F6F1E9;margin-top:40px\">From Zero to Product<\u002Fh2>\n      <p style=\"font-size:34px;line-height:1.4;color:#C9BBA6;margin-top:28px\">One project, every layer · How we think about every build<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Thinking in Products\" data-speaker-notes=\"The client never thinks in frontend, backend or DevOps. They use one product. If any layer is weak, the whole product feels weak, so each of us owns all of it.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Thinking in Products<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:520px 110px 1fr;align-items:center;margin-top:auto;margin-bottom:auto\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:600;color:#6B5D4C;text-decoration:line-through;text-decoration-color:#BE7539;text-decoration-thickness:4px\">Frontend<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:600;color:#6B5D4C;text-decoration:line-through;text-decoration-color:#BE7539;text-decoration-thickness:4px\">Backend<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:600;color:#6B5D4C;text-decoration:line-through;text-decoration-color:#BE7539;text-decoration-thickness:4px\">DevOps<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:600;color:#6B5D4C;text-decoration:line-through;text-decoration-color:#BE7539;text-decoration-thickness:4px\">Design<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:600;color:#6B5D4C;text-decoration:line-through;text-decoration-color:#BE7539;text-decoration-thickness:4px\">QA<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:64px;color:#BE7539;text-align:center\">→<\u002Fdiv>\n      <div style=\"background:#241B12;padding:56px 60px 60px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:120px;font-weight:600;letter-spacing:-.04em;line-height:1;color:#BE7539\">Product<\u002Fdiv>\n        <p style=\"font-size:32px;line-height:1.45;color:#C9BBA6;margin-top:28px\">Brand, platform, admin, security, quality and delivery, all owned by the same builder.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:600;color:#A4622E\">The client uses one product. Each of us is responsible for all of it.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Every Component of a Complete Product\" data-speaker-notes=\"Before writing code, list every component the product needs. This is the example we will follow through the next stages. Most projects fail on the pieces nobody listed: admin, emails, monitoring, backups.\" style=\"background:#F6F1E9;color:#241B12;padding:100px 110px 90px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',sans-serif\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#A4622E\">03 · From zero to product<\u002Fdiv>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin-top:22px;color:#241B12\">Every Component of a Complete Product<\u002Fh2>\n    <p style=\"font-size:30px;line-height:1.45;color:#5C5043;margin-top:26px;max-width:1500px\">Example: a field-service platform. Customers request a repair, technicians get the job on their phone, and the office runs everything.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:auto\">\n      <div style=\"background:#FBF8F2;border:1px solid rgba(36,27,18,.12);padding:28px 30px 30px\"><div style=\"font-family:'Space Grot
